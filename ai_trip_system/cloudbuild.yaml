steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_BASE_URL=$_NEXT_PUBLIC_API_BASE_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_BOOKING_API_URL=$_NEXT_PUBLIC_BOOKING_API_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_CHATBOT_SERVICE_URL=$_NEXT_PUBLIC_CHATBOT_SERVICE_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_GOOGLE_PLACES_API_KEY=$_NEXT_PUBLIC_GOOGLE_PLACES_API_KEY'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=$_NEXT_PUBLIC_SUPABASE_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=$_NEXT_PUBLIC_SUPABASE_ANON_KEY'
      - '--build-arg'
      - 'GOOGLE_CLIENT_ID=$_GOOGLE_CLIENT_ID'
      - '--build-arg'
      - 'GOOGLE_CLIENT_SECRET=$_GOOGLE_CLIENT_SECRET'
      - '--build-arg'
      - 'NEXTAUTH_URL=$_NEXTAUTH_URL'
      - '--build-arg'
      - 'NEXTAUTH_SECRET=$_NEXTAUTH_SECRET'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=$_NEXT_PUBLIC_APP_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_GOOGLE_API_KEY=$_NEXT_PUBLIC_GOOGLE_API_KEY'
      - '-t'
      - 'us-central1-docker.pkg.dev/travelweb-485107/cloud-run-source-deploy/ai-trip-frontend:latest'
      - '.'

images:
  - 'us-central1-docker.pkg.dev/travelweb-485107/cloud-run-source-deploy/ai-trip-frontend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
